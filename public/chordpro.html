<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chord Sheets - SelectSong</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/chordpro.css">
</head>
<body>
  <header>
    <h1>SelectSong</h1>
    <nav>
      <a href="/">Songs</a>
      <a href="/services.html">Recent Services</a>
      <a href="/chordpro.html" class="active">Chord Sheets</a>
      <a href="/suggest.html">Suggest</a>
      <a href="/plan.html">Plan</a>
    </nav>
  </header>
  <main>
    <section>
      <h2>Chord Sheets</h2>
      <div id="controls">
        <select id="file-select"><option value="">Select a song...</option></select>
        <label>Transpose to:
          <select id="key-select">
            <option value="">Original</option>
            <option>C</option><option>C#</option><option>D</option>
            <option>D#</option><option>E</option><option>F</option>
            <option>F#</option><option>G</option><option>G#</option>
            <option>A</option><option>A#</option><option>B</option>
          </select>
        </label>
        <button id="print-btn" class="btn">Print</button>
      </div>
      <div class="cp-spacing-control">
          <label>Font:</label>
          <select id="font-select">
            <option value="Georgia, serif">Georgia</option>
            <option value="Palatino, 'Palatino Linotype', serif">Palatino</option>
            <option value="Baskerville, 'Libre Baskerville', serif">Baskerville</option>
            <option value="Garamond, 'EB Garamond', serif">Garamond</option>
            <option value="Cambria, serif">Cambria</option>
            <option value="'Source Serif Pro', serif">Source Serif Pro</option>
            <option value="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" selected>System Sans</option>
          </select>
          <label>Size:</label>
          <input type="range" id="size-slider" min="12" max="24" value="18" step="1">
          <span id="size-label">18px</span>
          <label><input type="checkbox" id="auto-size" checked> Auto</label>
        </div>
      <div id="chord-output"></div>
    </section>
  </main>
  <script src="/js/chordpro.js"></script>
</body>
</html>
