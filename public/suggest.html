<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Song Suggestions - SelectSong</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <h1>SelectSong</h1>
    <nav>
      <a href="/">Songs</a>
      <a href="/services.html">Recent Services</a>
      <a href="/chordpro.html">Chord Sheets</a>
      <a href="/suggest.html" class="active">Suggest</a>
      <a href="/plan.html">Plan</a>
    </nav>
  </header>
  <main>
    <section>
      <h2>Get Song Suggestions</h2>
      <form id="suggest-form">
        <div class="form-group">
          <label for="theme">Theme</label>
          <input type="text" id="theme" placeholder="e.g. Life in the Spirit: the Spirit and Jesus" required>
        </div>
        <div class="form-group">
          <label for="passage">Bible Passage</label>
          <input type="text" id="passage" placeholder="e.g. Acts 10:34-48" required>
        </div>
        <button type="submit" class="btn" id="submit-btn">Get Suggestions</button>
      </form>

      <div id="loading" class="hidden">Thinking...</div>
      <div id="results" class="hidden">
        <h3>Recommended Set</h3>
        <table id="recommendations-table">
          <thead>
            <tr><th>Position</th><th>Song</th><th>Rating</th><th>Rationale</th></tr>
          </thead>
          <tbody></tbody>
        </table>

        <h3>Alternatives</h3>
        <table id="alternatives-table">
          <thead>
            <tr><th>Song</th><th>Rating</th><th>Best As</th><th>Rationale</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div id="error" class="hidden error"></div>
    </section>
  </main>
  <script src="/js/suggest.js"></script>
</body>
</html>
