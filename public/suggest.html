<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Song Suggestions - SelectSong</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <h1>SelectSong</h1>
    <nav>
      <a href="/">Songs</a>
      <a href="/services.html">Recent Services</a>
      <a href="/chordpro.html">Chord Sheets</a>
      <a href="/suggest.html" class="active">Suggest</a>
      <a href="/plan.html">Plan</a>
    </nav>
  </header>
  <main>
    <section>
      <h2>Plan a Service</h2>
      <form id="suggest-form">
        <div class="form-group">
          <label for="date">Date</label>
          <input type="date" id="date" required>
        </div>
        <div class="form-group">
          <label for="theme">Theme</label>
          <input type="text" id="theme" placeholder="e.g. Life in the Spirit: the Spirit and Jesus" required>
        </div>
        <div class="form-group">
          <label for="passage">Bible Passage</label>
          <input type="text" id="passage" placeholder="e.g. Acts 10:34-48" required>
        </div>
        <div class="form-group">
          <label for="notes">Notes <span class="label-hint">(optional)</span></label>
          <textarea id="notes" rows="4" placeholder="e.g. all-age service, we played Way Maker last Sunday, communion this week"></textarea>
        </div>
        <button type="submit" class="btn" id="submit-btn">Start Planning</button>
      </form>

      <div id="terminal-container" class="hidden">
        <div class="terminal-header">
          <span>Claude Code</span>
          <button class="btn btn-small" id="stop-btn">Stop</button>
          <a href="/plan.html" class="btn btn-small" id="view-plan-btn">View Plan</a>
        </div>
        <iframe id="terminal-frame" src=""></iframe>
      </div>
    </section>
  </main>
  <script src="/js/suggest.js"></script>
</body>
</html>
